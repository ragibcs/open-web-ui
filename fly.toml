# fly.toml app configuration file generated for open-web-ui-0guzbg on 2026-10-05T13:58:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'open-web-ui-0guzbg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENABLE_SIGNUP = 'true'
  OPENAI_API_BASE_URL = 'https://api.ragib.tech/v1'
  PORT = '8080'
  WEBUI_AUTH = 'true'

[[mounts]]
  source = 'open_webui_data'
  destination = '/app/backend/data'
  initial_size = '10gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 256
