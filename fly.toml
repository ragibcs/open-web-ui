app = "open-webui-ragib"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  WEBUI_AUTH = "true"
  ENABLE_SIGNUP = "true"
  OPENAI_API_BASE_URL = "https://api.ragib.tech/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "open_webui_data"
  destination = "/app/backend/data"
  initial_size = "10gb"
